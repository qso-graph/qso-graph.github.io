name: Deploy MkDocs to GitHub Pages

# Versions and tool counts on the site are collected from the released
# packages at build time (scripts/collect_servers.py), never typed. The daily
# build picks up a new release within a day. A pull request builds without
# deploying, so a broken page fails before it merges.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 7 * * *"  # daily 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Node 24 releases of all three: the v4/v5/v6 here ran on Node 20, which
      # GitHub has deprecated. The same versions the qso-graph packages use.
      - uses: actions/checkout@v5

      # A patch version, not "3.12": asked for a minor version, setup-python
      # may take an older 3.12 already on the runner, and only 3.12.16 and later
      # reject the compromised eMudhra intermediate CAs (2026-10).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'

      - uses: astral-sh/setup-uv@v7

      # pip trusts its own vendored certifi as well as the system store, so it
      # needs the release past the same advisory before it fetches anything.
      - name: Current pip
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip --version

      # Every package pinned with its hashes (requirements.in is what we ask
      # for; regenerate with the command at the top of requirements.txt). This
      # job holds a token that can push to the site.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Collect every server's released version and tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_servers.py

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
