name: Deploy MkDocs to GitHub Pages

# Versions and tool counts on the site are collected from the released
# packages at build time (scripts/collect_servers.py), never typed. The daily
# build picks up a new release within a day. A pull request builds without
# deploying, so a broken page fails before it merges.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 7 * * *"  # daily 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect every server's released version and tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_servers.py

      # install.sh lives in qso-graph-config; publish that file at
      # qso-graph.io/install.sh (the URL the READMEs give), never a copy.
      - name: Fetch install.sh from qso-graph-config
        run: |
          curl -fsSL https://raw.githubusercontent.com/qso-graph/qso-graph-config/main/install.sh -o docs/install.sh
          head -1 docs/install.sh | grep -qx '#!/bin/bash' || { echo "install.sh isn't a bash script"; exit 1; }

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
