name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Test documentation scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch released documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_docs.py
      - name: Collect released server versions and tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_servers.py
      - name: Install dependencies
        run: npm ci
      - name: Test the tool reference rendering
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: |
          cd build
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy documentation'
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
