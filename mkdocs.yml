site_name: QSO Graph
site_description: >-
  Open amateur radio software for your station: logging, nets, awards, spots and your radio, in one place,
  on Windows, macOS and Linux; with MCP servers connecting AI assistants to QRZ, LoTW, eQSL, HamQTH, POTA,
  SOTA, IOTA, space weather and WSPR. ADIF-based, open source, secure by design.
site_author: Greg Beam, KI7MT
site_url: https://qso-graph.io/
repo_url: https://github.com/qso-graph/qso-graph.github.io

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - scripts/nav.py

plugins:
  - search
  # Versions and tool counts come from data/servers.json (scripts/collect_servers.py).
  # Only pages with `render_macros: true` in their front matter are rendered.
  - redirects:
      redirect_maps:
        servers/qsp-mcp.md: tools/qsp-client/index.md  # renamed 2026-09-28
        servers/llm-stack.md: https://github.com/KI7MT/llm-stack  # moved to KI7MT 2026-10
        how-it-works.md: specification.md
        spec/index.md: specification.md
        spec/VISION.md: specification.md
        spec/PILLARS.md: specification.md
        spec/contracts/index.md: specification.md
        spec/contracts/club-definition.md: specification.md
        spec/governance/index.md: specification.md
        servers/adif-mcp.md: mcp-servers/adif-mcp/index.md
        servers/cq-zones.md: mcp-servers/cq-zones-mcp/index.md
        servers/darc-dok.md: mcp-servers/darc-dok-mcp/index.md
        servers/eqsl.md: mcp-servers/eqsl-mcp/index.md
        servers/hamqth.md: mcp-servers/hamqth-mcp/index.md
        servers/iota.md: mcp-servers/iota-mcp/index.md
        servers/itu-zones.md: mcp-servers/itu-zones-mcp/index.md
        servers/lotw.md: mcp-servers/lotw-mcp/index.md
        servers/n1mm-mcp.md: mcp-servers/n1mm-mcp/index.md
        servers/netlogger-mcp.md: mcp-servers/netlogger-mcp/index.md
        servers/omiss-mcp.md: mcp-servers/omiss-mcp/index.md
        servers/pota.md: mcp-servers/pota-mcp/index.md
        servers/qrz.md: mcp-servers/qrz-mcp/index.md
        servers/qso-graph-auth.md: libraries/qso-graph-auth/index.md
        servers/qsp-client.md: tools/qsp-client/index.md
        servers/solar.md: mcp-servers/solar-mcp/index.md
        servers/sota.md: mcp-servers/sota-mcp/index.md
        servers/wspr.md: mcp-servers/wspr-mcp/index.md
  - macros:
      render_by_default: false
      on_undefined: strict
      on_error_fail: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qso-graph
      name: QSO Graph on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/search/?q=qso-graph
      name: QSO Graph packages on PyPI
